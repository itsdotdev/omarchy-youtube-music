name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bin/youtube-music bin/cmd-k
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/check-player.mjs
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./macos/check.sh
      - run: xcrun swiftc -swift-version 5 -O macos/Sources/*.swift -o /tmp/YouTubeMusic
